# Ministry of Coal Science & Technology Scheme - Eligibility Rules v1
# Source: MoC S&T Guidelines 2023
rule_version: "1.0"
scheme_code: "MOC-ST"
effective_date: "2023-04-01"
supersedes: null

rules:
  - rule_id: "MOC-ST-ELIG-001"
    category: "eligibility"
    field: "institution_eligibility"
    description: "Applicant institution must be a recognised Indian academic, research, or industry organisation"
    operator: "in_list"
    limit_value: ["academic", "research_institute", "industry", "psu"]
    severity: "error"
    uncertainty_action: "review"
    source_reference: "MoC S&T Guidelines 2023, Section 3.1"

  - rule_id: "MOC-ST-ELIG-002"
    category: "eligibility"
    field: "pi_qualification"
    description: "Principal Investigator must hold a PhD or equivalent in a relevant discipline"
    operator: "minimum_qualification"
    limit_value: "phd"
    severity: "error"
    uncertainty_action: "review"
    source_reference: "MoC S&T Guidelines 2023, Section 3.2"

  - rule_id: "MOC-ST-ELIG-003"
    category: "eligibility"
    field: "project_duration"
    description: "Project duration must be 12-36 months"
    operator: "range"
    limit_value: "12-36"
    severity: "error"
    uncertainty_action: "clarification"
    source_reference: "MoC S&T Guidelines 2023, Section 5.1"

  - rule_id: "MOC-ST-ELIG-004"
    category: "eligibility"
    field: "duration_exception_above_24"
    description: "Duration above 24 months requires substantive justification"
    operator: "conditional_justification"
    limit_value: "above_24_months"
    severity: "exception_review"
    uncertainty_action: "exception"
    source_reference: "MoC S&T Guidelines 2023, Section 5.2"

  - rule_id: "MOC-ST-ELIG-005"
    category: "eligibility"
    field: "thrust_area_alignment"
    description: "Proposal must align with at least one approved thrust area"
    operator: "thrust_area_match"
    limit_value: null
    severity: "error"
    uncertainty_action: "review"
    source_reference: "MoC S&T Guidelines 2023, Section 2.1"

  - rule_id: "MOC-ST-FIN-001"
    category: "financial"
    field: "contingency_percentage"
    description: "Contingency must not exceed 5% of revenue expenditure"
    operator: "max_percentage"
    limit_value: "5"
    severity: "error"
    uncertainty_action: "clarification"
    source_reference: "MoC S&T Guidelines 2023, Section 7.3"

  - rule_id: "MOC-ST-FIN-002"
    category: "financial"
    field: "overhead_percentage"
    description: "Institutional overhead must not exceed 10% of total budget"
    operator: "max_percentage"
    limit_value: "10"
    severity: "error"
    uncertainty_action: "clarification"
    source_reference: "MoC S&T Guidelines 2023, Section 7.4"

  - rule_id: "MOC-ST-FIN-003"
    category: "financial"
    field: "foreign_travel"
    description: "Foreign travel requires prior approval and is limited to 10% of total budget"
    operator: "conditional_approval"
    limit_value: "max_10_percent"
    severity: "exception_review"
    uncertainty_action: "exception"
    source_reference: "MoC S&T Guidelines 2023, Section 7.5"

  - rule_id: "MOC-ST-FIN-004"
    category: "financial"
    field: "staff_vehicles"
    description: "Purchase of staff vehicles is not permitted"
    operator: "prohibited"
    limit_value: null
    severity: "error"
    uncertainty_action: "exception"
    source_reference: "MoC S&T Guidelines 2023, Section 7.6"

  - rule_id: "MOC-ST-FIN-005"
    category: "financial"
    field: "permanent_salary"
    description: "Permanent institutional salaries are not chargeable to the project"
    operator: "prohibited"
    limit_value: null
    severity: "error"
    uncertainty_action: "review"
    source_reference: "MoC S&T Guidelines 2023, Section 7.7"

  - rule_id: "MOC-ST-FIN-006"
    category: "financial"
    field: "equipment_duplication"
    description: "No duplicate equipment requests without justification"
    operator: "duplicate_check"
    limit_value: null
    severity: "clarification"
    uncertainty_action: "clarification"
    source_reference: "MoC S&T Guidelines 2023, Section 7.8"

  - rule_id: "MOC-ST-COMP-001"
    category: "compliance"
    field: "dgms_approval"
    description: "Mine-safety equipment trials require DGMS approval"
    operator: "conditional_requirement"
    limit_value: null
    severity: "error"
    uncertainty_action: "review"
    source_reference: "MoC S&T Guidelines 2023, Section 8.1"
